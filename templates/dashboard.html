
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Disease Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    color:white;
    font-family:Arial;

}

.container{

    padding-top:50px;

}

.glass-card{

    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);

}

.title{

    font-size:40px;
    margin-bottom:30px;
    font-weight:bold;

}

.form-control{

    height:55px;
    margin-bottom:20px;
    background: rgba(255,255,255,0.12);
    border:none;
    color:white;

}

.form-control:focus{

    background: rgba(255,255,255,0.18);
    color:white;
    box-shadow:none;

}

label{

    margin-bottom:10px;
    font-size:18px;

}

.predict-btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-size:18px;

}

.report-box{

    margin-top:40px;
    background: rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="glass-card">

<h1 class="title">

<i class="fa-solid fa-heart-pulse"></i>
AI Disease Predictor

</h1>

<form action="/predict" method="POST">

<input type="text"
name="patient_name"
class="form-control"
placeholder="Enter Patient Name"
required>

<!-- FEVER -->

<label>Fever</label>

<select name="fever"
id="feverSelect"
class="form-control">

<option>No</option>
<option>Yes</option>

</select>

<!-- FEVER TYPE -->

<div id="feverTypeBox" style="display:none;">

<label>Fever Type</label>

<select name="fever_type"
class="form-control">

<option>Low Fever</option>
<option>High Fever</option>

</select>

</div>

<!-- COUGH -->

<label>Cough</label>

<select name="cough"
class="form-control">

<option>No</option>
<option>Yes</option>

</select>

<!-- HEADACHE -->

<label>Headache</label>

<select name="headache"
class="form-control">

<option>No</option>
<option>Yes</option>

</select>

<!-- FATIGUE -->

<label>Fatigue</label>

<select name="fatigue"
class="form-control">

<option>No</option>
<option>Yes</option>

</select>

<button type="submit"
class="predict-btn">

<i class="fa-solid fa-brain"></i>
Predict Disease

</button>

</form>

{% if prediction %}

<div class="report-box">

<h2>Generated Report</h2>

<p><b>Patient Name:</b> {{ patient_name }}</p>

<p><b>Predicted Disease:</b> {{ prediction }}</p>

<p><b>Doctor Advice:</b> {{ doctor_advice }}</p>

<p><b>Health Tips:</b> {{ tips }}</p>

<p><b>Date:</b> {{ report_time }}</p>

</div>

{% endif %}

</div>

</div>

<script>

document.getElementById("feverSelect").addEventListener("change", function(){

    if(this.value == "Yes"){

        document.getElementById("feverTypeBox").style.display = "block";

    }

    else{

        document.getElementById("feverTypeBox").style.display = "none";

    }

});

</script>

</body>
</html>
