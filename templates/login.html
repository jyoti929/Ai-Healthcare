
<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#141e30;height:100vh;display:flex;justify-content:center;align-items:center;">

<div style="width:400px;background:white;padding:40px;border-radius:20px;">

<h1 class="mb-4">Login</h1>

<form action="/login_user" method="POST">

<input type="text"
name="username"
class="form-control mb-3"
placeholder="Username"
required>

<input type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required>

<button type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<a href="/signup"
class="btn btn-success w-100 mt-3">

Create Account

</a>

</div>

</body>
</html>
