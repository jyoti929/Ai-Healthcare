<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    font-family:Arial;
    color:white;

}

/* SIDEBAR */

.sidebar{

    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    padding:30px 20px;

}

.logo{

    text-align:center;
    font-size:28px;
    margin-bottom:40px;

}

.menu-btn{

    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    color:white;
    padding:15px 20px;
    border-radius:15px;
    margin-bottom:18px;
    font-size:18px;
    transition:0.3s;

}

.menu-btn:hover{

    transform:translateX(8px);
    color:white;

}

.dashboard-btn{
    background: linear-gradient(45deg,#00c6ff,#0072ff);
}

.reports-btn{
    background: linear-gradient(45deg,#11998e,#38ef7d);
}

.health-btn{
    background: linear-gradient(45deg,#f7971e,#ffd200);
}

.hospital-btn{
    background: linear-gradient(45deg,#8e2de2,#4a00e0);
}

.analytics-btn{
    background: linear-gradient(45deg,#fc466b,#3f5efb);
}

.settings-btn{
    background: linear-gradient(45deg,#00b09b,#96c93d);
}

.logout-btn{
    background: linear-gradient(45deg,#ff416c,#ff4b2b);
}

/* MAIN CONTENT */

.main-content{

    margin-left:280px;
    padding:40px;

}

.analytics-box{

    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:25px;
    backdrop-filter: blur(15px);

}

.title{

    font-size:40px;
    margin-bottom:30px;
    font-weight:bold;

}

.stats-container{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;

}

.stat-card{

    background: rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    text-align:center;

}

.stat-card h2{

    font-size:35px;

}

canvas{

    background:white;
    border-radius:20px;
    padding:20px;

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-heart-pulse"></i>
        AI Health

    </div>

    <a href="/dashboard" class="menu-btn dashboard-btn">

        <i class="fa-solid fa-stethoscope"></i>
        Dashboard

    </a>

    <a href="/reports" class="menu-btn reports-btn">

        <i class="fa-solid fa-file-medical"></i>
        Reports

    </a>

    <a href="/health" class="menu-btn health-btn">

        <i class="fa-solid fa-leaf"></i>
        Health Tips

    </a>

    <a href="/hospitals" class="menu-btn hospital-btn">

        <i class="fa-solid fa-hospital"></i>
        Hospitals

    </a>

    <a href="/analytics" class="menu-btn analytics-btn">

        <i class="fa-solid fa-chart-column"></i>
        Analytics

    </a>

    <a href="/settings" class="menu-btn settings-btn">

        <i class="fa-solid fa-gear"></i>
        Settings

    </a>

    <a href="/logout" class="menu-btn logout-btn">

        <i class="fa-solid fa-right-from-bracket"></i>
        Logout

    </a>

</div>

<!-- MAIN CONTENT -->

<div class="main-content">

    <div class="analytics-box">

        <h1 class="title">

            Disease Analytics Dashboard

        </h1>

        <div class="stats-container">

            <div class="stat-card">

                <h2>{{ counts | sum }}</h2>

                <p>Total Patients</p>

            </div>

            <div class="stat-card">

                <h2>{{ diseases | length }}</h2>

                <p>Total Diseases</p>

            </div>

        </div>

        <canvas id="myChart"></canvas>

    </div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: {{ diseases | tojson }},

        datasets: [{

            label: 'Patients Count',

            data: {{ counts | tojson }},

            borderWidth: 2

        }]

    },

    options: {

        responsive:true,

        scales: {

            y: {

                beginAtZero:true

            }

        }

    }

});

</script>

</body>
</html>
```
