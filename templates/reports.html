<!DOCTYPE html>
<html>
<head>
<title>Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#141e30;color:white;">
<div class="container mt-5">
<h1>Saved Reports</h1>

{% for report in reports %}
<div class="bg-dark p-4 rounded mb-4">
<p><b>Patient:</b> {{ report[0] }}</p>
<p><b>Disease:</b> {{ report[1] }}</p>
<p><b>Doctor Advice:</b> {{ report[2] }}</p>
<p><b>Health Tips:</b> {{ report[3] }}</p>
<p><b>Hospitals:</b> {{ report[4] }}</p>
<p><b>Date:</b> {{ report[5] }}</p>
</div>
{% endfor %}
</div>
</body>
</html>
