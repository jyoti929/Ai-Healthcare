
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nearby Hospitals</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    color:white;
    font-family:Arial;

}

.main-container{

    padding:40px;

}

.title{

    font-size:45px;
    font-weight:bold;
    margin-bottom:40px;
    text-align:center;

}

.hospital-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;

}

.hospital-card{

    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding:30px;
    border-radius:25px;
    transition:0.3s;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);

}

.hospital-card:hover{

    transform:translateY(-10px);

}

.hospital-icon{

    font-size:50px;
    margin-bottom:20px;
    color:#00c6ff;

}

.hospital-name{

    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;

}

.info{

    margin-bottom:12px;
    color:#ddd;
    font-size:17px;

}

.map-btn{

    display:inline-block;
    margin-top:15px;
    padding:12px 22px;
    border-radius:12px;
    text-decoration:none;
    color:white;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    transition:0.3s;

}

.map-btn:hover{

    transform:scale(1.05);
    color:white;

}

</style>

</head>

<body>

<div class="main-container">

    <h1 class="title">

        <i class="fa-solid fa-hospital"></i>
        Nearby Hospitals

    </h1>

    <div class="hospital-grid">

        <!-- HOSPITAL 1 -->

        <div class="hospital-card">

            <div class="hospital-icon">

                <i class="fa-solid fa-hospital"></i>

            </div>

            <div class="hospital-name">

                Apollo Hospital

            </div>

            <div class="info">

                <i class="fa-solid fa-location-dot"></i>
                Raipur, Chhattisgarh

            </div>

            <div class="info">

                <i class="fa-solid fa-road"></i>
                Distance: 2.5 KM

            </div>

            <div class="info">

                <i class="fa-solid fa-phone"></i>
                Emergency: +91 9876543210

            </div>

            <a href="https://maps.google.com"
            target="_blank"
            class="map-btn">

                <i class="fa-solid fa-map-location-dot"></i>
                Open Map

            </a>

        </div>

        <!-- HOSPITAL 2 -->

        <div class="hospital-card">

            <div class="hospital-icon">

                <i class="fa-solid fa-hospital"></i>

            </div>

            <div class="hospital-name">

                AIIMS Hospital

            </div>

            <div class="info">

                <i class="fa-solid fa-location-dot"></i>
                Bilaspur, Chhattisgarh

            </div>

            <div class="info">

                <i class="fa-solid fa-road"></i>
                Distance: 5 KM

            </div>

            <div class="info">

                <i class="fa-solid fa-phone"></i>
                Emergency: +91 9988776655

            </div>

            <a href="https://maps.google.com"
            target="_blank"
            class="map-btn">

                <i class="fa-solid fa-map-location-dot"></i>
                Open Map

            </a>

        </div>

        <!-- HOSPITAL 3 -->

        <div class="hospital-card">

            <div class="hospital-icon">

                <i class="fa-solid fa-hospital"></i>

            </div>

            <div class="hospital-name">

                Fortis Healthcare

            </div>

            <div class="info">

                <i class="fa-solid fa-location-dot"></i>
                Raipur, Chhattisgarh

            </div>

            <div class="info">

                <i class="fa-solid fa-road"></i>
                Distance: 3.8 KM

            </div>

            <div class="info">

                <i class="fa-solid fa-phone"></i>
                Emergency: +91 9090909090

            </div>

            <a href="https://maps.google.com"
            target="_blank"
            class="map-btn">

                <i class="fa-solid fa-map-location-dot"></i>
                Open Map

            </a>

        </div>

    </div>

</div>

</body>
</html>
